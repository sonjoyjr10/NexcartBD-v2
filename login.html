<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Supper Shop</title>
<meta name="description" content="Log in to your Supper Shop account to top up games and manage your wallet." />
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header class="site-header">
  <div class="container">
    <a href="/index.html" class="brand"><span class="chip-dot"></span>Supper<span class="accent">Shop</span></a>
    <nav class="nav-links"><a href="/index.html">Store</a></nav>
    <div class="header-actions"><a href="/register.html" class="btn btn-sm btn-gold">Sign Up</a></div>
  </div>
</header>

<main class="auth-shell">
  <div class="auth-card glass">
    <h2>Welcome back</h2>
    <p class="sub">Log in to manage your wallet and orders.</p>

    <form id="login-form" novalidate>
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <div class="input-group">
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>
        <div class="hint"><a href="/forgot-password.html">Forgot your password?</a></div>
      </div>
      <button class="btn btn-gold btn-block" type="submit" id="login-submit">Log In</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="/register.html">Create one free</a></p>
  </div>
</main>

<script type="module" src="/js/auth-pages.js"></script>
</body>
</html>
