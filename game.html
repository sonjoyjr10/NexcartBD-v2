<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="page-title">Top Up — Supper Shop</title>
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header class="site-header">
  <div class="container">
    <a href="/index.html" class="brand"><span class="chip-dot"></span>Supper<span class="accent">Shop</span></a>
    <nav class="nav-links">
      <a href="/index.html">Store</a>
      <a href="/blog.html">Blog</a>
      <a href="/faq.html">FAQ</a>
    </nav>
    <div class="header-actions" id="header-actions"></div>
  </div>
</header>

<main>
  <section class="section">
    <div class="container">
      <div class="grid" style="grid-template-columns:280px 1fr;gap:32px;align-items:start" id="game-layout">
        <div class="card glass" id="game-info">
          <div class="skeleton" style="height:220px;margin-bottom:16px"></div>
          <div class="skeleton" style="height:20px;width:70%"></div>
        </div>

        <div>
          <div class="section-head">
            <div>
              <h2 id="game-name">Loading…</h2>
              <p class="text-muted">Choose a package, enter your player details, and check out with your wallet.</p>
            </div>
            <button class="btn btn-sm btn-outline" id="wishlist-btn">♡ Save</button>
          </div>

          <div class="grid grid-4" id="packages-grid">
            <!-- skeleton / packages -->
          </div>

          <form class="card glass mt-24" id="checkout-form">
            <h3 class="mb-16">Order details</h3>
            <div class="grid grid-2 gap-16">
              <div class="form-field">
                <label for="playerId">Player ID</label>
                <input type="text" id="playerId" required />
              </div>
              <div class="form-field">
                <label for="serverId">Server ID (if applicable)</label>
                <input type="text" id="serverId" />
              </div>
            </div>
            <div class="grid grid-2 gap-16">
              <div class="form-field">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" value="1" min="1" max="10" />
              </div>
              <div class="form-field">
                <label for="couponCode">Coupon code (optional)</label>
                <input type="text" id="couponCode" placeholder="e.g. WELCOME10" />
              </div>
            </div>
            <div class="flex-between mt-16" style="padding:16px;border-radius:12px;background:rgba(255,255,255,.03)">
              <span class="text-muted">Total</span>
              <span class="mono text-gold" style="font-size:1.3rem" id="order-total">$0.00</span>
            </div>
            <button type="submit" class="btn btn-gold btn-block mt-16" id="checkout-submit" disabled>Select a package to continue</button>
          </form>

          <div class="mt-32">
            <div class="section-head"><h3>Reviews</h3></div>
            <div id="reviews-list"></div>
            <button class="btn btn-sm btn-outline mt-16" id="write-review-btn">Write a review</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<script type="module" src="/js/game-page.js"></script>
</body>
</html>
