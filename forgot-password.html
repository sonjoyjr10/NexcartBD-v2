<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — Supper Shop</title>
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header class="site-header">
  <div class="container">
    <a href="/index.html" class="brand"><span class="chip-dot"></span>Supper<span class="accent">Shop</span></a>
    <nav class="nav-links"><a href="/index.html">Store</a></nav>
    <div class="header-actions"><a href="/login.html" class="btn btn-sm btn-outline">Login</a></div>
  </div>
</header>

<main class="auth-shell">
  <div class="auth-card glass">
    <h2>Reset your password</h2>
    <p class="sub">We'll email you a secure link to set a new password.</p>

    <form id="forgot-form" novalidate>
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
      </div>
      <button class="btn btn-gold btn-block" type="submit" id="forgot-submit">Send Reset Link</button>
    </form>

    <p class="auth-switch">Remembered it? <a href="/login.html">Back to login</a></p>
  </div>
</main>

<script type="module" src="/js/auth-pages.js"></script>
</body>
</html>
